<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Giao diện trình tạo trợ lý AI 3 chế độ Cơ bản, Nâng cao và AI thiết kế luồng">
  <defs>
    <linearGradient id="abBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="abCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6e4a"/>
      <stop offset="100%" stop-color="#ff5a36"/>
    </linearGradient>
    <filter id="abShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#abBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Bar -->
  <rect x="24" y="20" width="912" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="48" cy="44" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="44" r="6" fill="#ffbd2e"/>
  <circle cx="88" cy="44" r="6" fill="#27c93f"/>
  <text x="112" y="49" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Trình tạo Trợ lý (/agents/builder) — Thẩm định hồ sơ &amp; Tổng hợp báo cáo</text>

  <!-- Mode Switcher Pills -->
  <rect x="556" y="28" width="364" height="32" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="606" y="48" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Cơ bản</text>
  <rect x="652" y="31" width="110" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="707" y="48" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Nâng cao</text>
  <rect x="768" y="31" width="148" height="26" rx="13" fill="url(#abCoral)"/>
  <text x="842" y="48" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">✨ AI thiết kế luồng</text>

  <!-- Left Panel: Inputs, Models, Skills -->
  <g filter="url(#abShadow)">
    <rect x="24" y="84" width="300" height="432" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="114" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">1. Ô nhập thông tin (Inputs)</text>
    <text x="44" y="132" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#64748b">Khai báo một lần, dùng cho mọi bước</text>

    <rect x="44" y="144" width="260" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="163" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">📄 Hồ sơ / Văn bản đính kèm *</text>
    <text x="56" y="178" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#4f46e5">Loại: Tệp PDF/Word/Ảnh · Hỗ trợ OCR</text>

    <rect x="44" y="194" width="260" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="213" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🔢 Dự toán &amp; Số ngày xử lý</text>
    <text x="56" y="228" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#059669">Loại: Số &amp; Lựa chọn · Kiểm chéo tự động</text>

    <rect x="44" y="244" width="260" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="263" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">📑 Tài liệu đầu ra trong Work</text>
    <text x="56" y="278" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#ea580c">Loại: Tài nguyên document / sheet</text>

    <line x1="44" y1="302" x2="304" y2="302" stroke="#e2e8f0"/>

    <text x="44" y="326" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">2. Kỹ năng &amp; Tri thức riêng</text>
    <rect x="44" y="338" width="124" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="106" y="358" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">🧩 SKILL.md (2)</text>
    <rect x="176" y="338" width="128" height="32" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="240" y="358" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">📚 Kho tri thức (5)</text>

    <text x="44" y="396" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">3. Đầu ra &amp; Model ưu tiên</text>
    <rect x="44" y="408" width="260" height="42" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="56" y="426" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#4338ca">Cách hiển thị: Trình soạn tài liệu</text>
    <text x="56" y="442" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Cho phép bôi đen sửa bằng AI &amp; xuất .docx</text>

    <rect x="44" y="460" width="260" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="484" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Vai trò model: Phân tích → Viết → Kiểm tra</text>
  </g>

  <!-- Right Panel: Workflow Designer Canvas -->
  <g filter="url(#abShadow)">
    <rect x="344" y="84" width="592" height="432" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- AI Workflow Designer Prompt Banner -->
    <rect x="364" y="102" width="552" height="58" rx="12" fill="#fff1ee" stroke="#ffd2c7"/>
    <text x="382" y="124" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="800" fill="#c23315">✨ AI thiết kế luồng làm việc tự động</text>
    <text x="382" y="144" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#475569">“Đọc hồ sơ PDF scan, tra cứu quy định, tính dự toán + ngày làm việc, xuất báo cáo Word”</text>
    <rect x="812" y="114" width="90" height="32" rx="16" fill="url(#abCoral)"/>
    <text x="857" y="134" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Đã sinh 4 bước</text>

    <!-- Step 1 -->
    <rect x="364" y="176" width="552" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="378" y="190" width="36" height="36" rx="10" fill="#eef2ff"/>
    <text x="396" y="213" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="800" fill="#4f46e5">01</text>
    <text x="428" y="201" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Đọc tệp đính kèm &amp; OCR nhiều trang</text>
    <text x="428" y="221" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#475569">Trích xuất văn bản theo khúc (foreach_input), gắn nhãn [Trang N] và kiểm tra cổng độ mật</text>
    <rect x="822" y="194" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="862" y="210" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#3730a3">files + OCR</text>

    <!-- Step 2 -->
    <rect x="364" y="252" width="552" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="378" y="266" width="36" height="36" rx="10" fill="#ecfdf5"/>
    <text x="396" y="289" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="800" fill="#059669">02</text>
    <text x="428" y="277" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Tra cứu hiệu lực &amp; Công cụ tính toán xác định</text>
    <text x="428" y="297" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#475569">Gọi law.lookup, calc.evaluate, number.to_words và date.workdays để kiểm tra số liệu</text>
    <rect x="806" y="270" width="96" height="24" rx="12" fill="#d1fae5"/>
    <text x="854" y="286" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">action · chuẩn</text>

    <!-- Step 3 -->
    <rect x="364" y="328" width="552" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="378" y="342" width="36" height="36" rx="10" fill="#fffbeb"/>
    <text x="396" y="365" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="800" fill="#d97706">03</text>
    <text x="428" y="353" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Rẽ nhánh điều kiện &amp; Hỏi người duyệt khi thiếu thông tin</text>
    <text x="428" y="373" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#475569">Nếu hồ sơ thiếu chứng từ → tạm dừng hỏi bổ sung; nếu hợp lệ → tổng hợp dự thảo báo cáo</text>
    <rect x="822" y="346" width="80" height="24" rx="12" fill="#fef3c7"/>
    <text x="862" y="362" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">if / input</text>

    <!-- Step 4 -->
    <rect x="364" y="404" width="552" height="64" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <rect x="378" y="418" width="36" height="36" rx="10" fill="#059669"/>
    <text x="396" y="441" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">04</text>
    <text x="428" y="429" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">Xuất tài liệu GenOffice Word &amp; Gửi thông báo / Email</text>
    <text x="428" y="449" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#047857">Tạo tệp mới trong thư mục Work kèm trích dẫn nguồn, gửi bản tóm tắt tới email đã xác minh</text>
    <rect x="806" y="422" width="96" height="24" rx="12" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="854" y="438" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#047857">document.create</text>

    <!-- Footer status inside canvas -->
    <text x="364" y="496" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">✓ Đã kiểm tra cấu hình hợp lệ · Có thể chạy thử ngay hoặc xuất bản lên Kho trợ lý</text>
  </g>
</svg>

