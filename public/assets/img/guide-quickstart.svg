<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Sơ đồ hướng dẫn 4 bước bắt đầu sử dụng Gehihi AI Agent Platform">
  <defs>
    <linearGradient id="gqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="gqBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6e4a"/>
      <stop offset="100%" stop-color="#ff5a36"/>
    </linearGradient>
    <filter id="gqShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="24" fill="url(#gqBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="480" y="46" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Lộ trình 4 bước làm chủ Gehihi AI Agent Platform</text>
  <text x="480" y="68" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12.5" fill="#475569">Từ trải nghiệm nhanh không cần đăng nhập đến tự động hóa toàn bộ quy trình tài liệu &amp; công việc</text>

  <!-- Step 1 -->
  <g filter="url(#gqShadow)">
    <rect x="28" y="92" width="212" height="396" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="46" y="112" width="44" height="44" rx="12" fill="url(#gqBrand)"/>
    <text x="68" y="140" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">01</text>
    <text x="102" y="130" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">Khám phá &amp; Chat</text>
    <text x="102" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#c2410c" font-weight="600">/ · /agents/explore</text>

    <rect x="46" y="172" width="176" height="84" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="58" y="194" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a3412">Ô chat đa năng:</text>
    <text x="58" y="214" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Gõ <tspan font-weight="700" fill="#c2410c">@</tspan> để gọi trợ lý</text>
    <text x="58" y="232" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Gõ <tspan font-weight="700" fill="#c2410c">/</tspan> để gắn kỹ năng</text>
    <text x="58" y="248" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Bật Tra cứu / Research</text>

    <text x="46" y="282" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Khách chưa đăng nhập vẫn</text>
    <text x="46" y="300" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  chạy được trợ lý miễn phí</text>
    <text x="46" y="324" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Tự động gợi ý công cụ phù</text>
    <text x="46" y="342" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  hợp ngay dưới câu trả lời</text>
    <text x="46" y="366" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Nhập dữ liệu khách vào tài</text>
    <text x="46" y="384" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  khoản sau khi đăng ký</text>

    <rect x="46" y="434" width="176" height="34" rx="10" fill="#fff1ee"/>
    <text x="134" y="455" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c23315">Thử ngay không cần code</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#gqShadow)">
    <rect x="256" y="92" width="212" height="396" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="274" y="112" width="44" height="44" rx="12" fill="#4f46e5"/>
    <text x="296" y="140" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">02</text>
    <text x="330" y="130" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">Tạo Trợ lý riêng</text>
    <text x="330" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#4338ca" font-weight="600">/agents/builder</text>

    <rect x="274" y="172" width="176" height="84" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="286" y="194" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#3730a3">3 chế độ linh hoạt:</text>
    <text x="286" y="214" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• <tspan font-weight="700">Cơ bản:</tspan> Prompt + Input</text>
    <text x="286" y="232" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• <tspan font-weight="700">Nâng cao:</tspan> Nhiều bước</text>
    <text x="286" y="248" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• <tspan font-weight="700">AI thiết kế luồng</tspan></text>

    <text x="274" y="282" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Thêm kỹ năng SKILL.md</text>
    <text x="274" y="300" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  và tài liệu tri thức riêng</text>
    <text x="274" y="324" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Đọc PDF scan bằng OCR,</text>
    <text x="274" y="342" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  tính toán chuẩn xác</text>
    <text x="274" y="366" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Chọn hiển thị kết quả bằng</text>
    <text x="274" y="384" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  Trình soạn tài liệu</text>

    <rect x="274" y="434" width="176" height="34" rx="10" fill="#eef2ff"/>
    <text x="362" y="455" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#4338ca">Lưu riêng hoặc đưa lên Kho</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#gqShadow)">
    <rect x="484" y="92" width="212" height="396" rx="18" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
    <rect x="502" y="112" width="44" height="44" rx="12" fill="#0891b2"/>
    <text x="524" y="140" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">03</text>
    <text x="558" y="130" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">Work &amp; GenOffice</text>
    <text x="558" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#0e7490" font-weight="600">/work · /documents · /studio</text>

    <rect x="502" y="172" width="176" height="84" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="514" y="194" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#155e75">Không gian làm việc:</text>
    <text x="514" y="214" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Cây thư mục có nguồn gốc</text>
    <text x="514" y="232" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Word, Sheets, Slide, PDF</text>
    <text x="514" y="248" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Studio dựng Landing &amp; Code</text>

    <text x="502" y="282" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Chat ngay trong thư mục</text>
    <text x="502" y="300" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  kèm trích dẫn tới trang/ô</text>
    <text x="502" y="324" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Bôi đen đoạn văn để nhờ</text>
    <text x="502" y="342" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  AI viết lại, xuất NĐ 30</text>
    <text x="502" y="366" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Đồng bộ Google Sheets &amp;</text>
    <text x="502" y="384" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  sao lưu tự động lên Drive</text>

    <rect x="502" y="434" width="176" height="34" rx="10" fill="#ecfeff"/>
    <text x="590" y="455" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0e7490">Mọi tài liệu trong một nơi</text>
  </g>

  <!-- Step 4 -->
  <g filter="url(#gqShadow)">
    <rect x="712" y="92" width="220" height="396" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="730" y="112" width="44" height="44" rx="12" fill="#059669"/>
    <text x="752" y="140" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">04</text>
    <text x="786" y="130" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">Tự động &amp; Nhóm</text>
    <text x="786" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#047857" font-weight="600">/ai/schedules · /account/team</text>

    <rect x="730" y="172" width="184" height="84" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="742" y="194" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">Vận hành liên tục:</text>
    <text x="742" y="214" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Đặt lịch ngày/tuần/tháng</text>
    <text x="742" y="232" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Trigger khi tệp cập nhật</text>
    <text x="742" y="248" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Gọi qua Webhook riêng</text>

    <text x="730" y="282" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Gửi báo cáo tự động tới</text>
    <text x="730" y="300" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  địa chỉ email đã xác minh</text>
    <text x="730" y="324" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Kết nối MCP (Drive, GitHub,</text>
    <text x="730" y="342" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  Notion, Linear) có kiểm quyền</text>
    <text x="730" y="366" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">✓ Mời thành viên vào Nhóm</text>
    <text x="730" y="384" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#334155">  &amp; dùng chung ví Credits</text>

    <rect x="730" y="434" width="184" height="34" rx="10" fill="#ecfdf5"/>
    <text x="822" y="455" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">Theo dõi lịch sử &amp; thông báo</text>
  </g>
</svg>

