<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Sơ đồ Kết nối MCP, Sao lưu Google Drive, Luồng Model dự phòng và Quản lý Nhóm trên Gehihi">
  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="mcShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#mcBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Bar -->
  <rect x="24" y="20" width="912" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="48" cy="43" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="43" r="6" fill="#ffbd2e"/>
  <circle cx="88" cy="43" r="6" fill="#27c93f"/>
  <text x="112" y="48" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Kết nối MCP · Luồng Model dự phòng · Không gian làm việc Nhóm</text>

  <!-- Column 1: MCP & Google Drive -->
  <g filter="url(#mcShadow)">
    <rect x="24" y="82" width="292" height="434" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="44" y="102" width="164" height="26" rx="8" fill="#ecfdf5"/>
    <text x="126" y="119" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#047857">🔌 Kết nối MCP (/connections)</text>

    <text x="44" y="150" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">OAuth an toàn &amp; Phân quyền</text>
    <text x="44" y="170" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#475569">Kết nối nhiều tài khoản, cấp quyền theo từng trợ lý</text>

    <rect x="44" y="186" width="252" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="58" y="207" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">☁️ Google Drive &amp; Sheets</text>
    <text x="58" y="224" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#059669">Sao lưu tự động revision · Đọc MCP · Đồng bộ bảng</text>

    <rect x="44" y="242" width="252" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="58" y="263" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🐙 GitHub · 📝 Notion · 📋 Linear</text>
    <text x="58" y="280" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Đọc tài liệu, issue, repo &amp; Context7 tài liệu kỹ thuật</text>

    <rect x="44" y="298" width="252" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="58" y="319" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4338ca">🔑 Gehihi làm MCP Server</text>
    <text x="58" y="336" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Tạo khóa `ghm_…` để ứng dụng ngoài gọi vào</text>
    <text x="58" y="350" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">tài liệu và trợ lý trong phạm vi bạn cấp phép</text>

    <rect x="44" y="370" width="252" height="126" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="58" y="392" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c">🛡️ Bảo mật nhiều lớp</text>
    <text x="58" y="412" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• PKCE S256, mã hóa token trên máy chủ</text>
    <text x="58" y="432" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Ghim phiên bản quyền (grant) cho mỗi lượt</text>
    <text x="58" y="452" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Kiểm tra công cụ ghi trước khi thực thi</text>
    <text x="58" y="472" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Ngắt kết nối &amp; thu hồi quyền bất cứ lúc nào</text>
  </g>

  <!-- Column 2: Model Flows & BYOK -->
  <g filter="url(#mcShadow)">
    <rect x="334" y="82" width="292" height="434" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="354" y="102" width="168" height="26" rx="8" fill="#eef2ff"/>
    <text x="438" y="119" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#4338ca">⚡ Thiết lập AI (/account/ai)</text>

    <text x="354" y="150" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">Luồng Model &amp; Khóa API riêng</text>
    <text x="354" y="170" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#475569">Tự động chuyển sang model dự phòng khi quá tải</text>

    <!-- Primary + Fallback stack -->
    <rect x="354" y="186" width="252" height="46" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="368" y="206" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">Model chính (Theo từng tác vụ)</text>
    <text x="368" y="222" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Gemini / Claude / GPT / OpenAI-compatible</text>

    <text x="480" y="246" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="800" fill="#64748b">↓ Tự động dự phòng (1 → 4)</text>

    <rect x="354" y="256" width="252" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="368" y="275" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Dự phòng 1 &amp; 2: Vertex AI / Anthropic</text>
    <text x="368" y="290" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#64748b">Giữ nguyên ngữ cảnh lượt chạy khi thử lại</text>

    <rect x="354" y="306" width="252" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="368" y="325" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Dự phòng 3 &amp; 4: DeepSeek / OpenAI</text>
    <text x="368" y="340" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#64748b">Cấu hình riêng cho Chat, Agent, Research, Ảnh</text>

    <rect x="354" y="362" width="252" height="134" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="368" y="384" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🔍 Dịch vụ tìm kiếm luân phiên</text>
    <text x="368" y="404" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Hỗ trợ Tavily, Serper, SerpAPI, Brave,</text>
    <text x="368" y="422" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">  Exa và SearXNG (tự xoay vòng nhiều khóa)</text>
    <text x="368" y="446" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#059669" font-weight="600">• Khóa API riêng (BYOK) mã hóa trên server</text>
    <text x="368" y="466" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">• Ẩn thông tin cá nhân (SĐT, CCCD, Email)</text>
    <text x="368" y="484" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#475569">  trước khi gửi tới mô hình AI đám mây</text>
  </g>

  <!-- Column 3: Team Workspace & Plans -->
  <g filter="url(#mcShadow)">
    <rect x="644" y="82" width="292" height="434" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="664" y="102" width="184" height="26" rx="8" fill="#fff1ee"/>
    <text x="756" y="119" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#c23315">👥 Nhóm &amp; Gói (/account/team)</text>

    <text x="664" y="150" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">Workspace Cá nhân &amp; Tổ chức</text>
    <text x="664" y="170" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11.5" fill="#475569">Chuyển đổi nhanh giữa không gian cá nhân và nhóm</text>

    <rect x="664" y="186" width="252" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="678" y="206" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🏢 Phân quyền Thành viên &amp; Phòng ban</text>
    <text x="678" y="224" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Chủ sở hữu · Quản trị · Thành viên</text>
    <text x="678" y="238" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#0891b2">Chia sẻ thư mục Work theo phòng ban</text>

    <rect x="664" y="256" width="252" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="678" y="276" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">💳 Gói thuê bao &amp; Chỗ ngồi (Seats)</text>
    <text x="678" y="294" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Gói Cá nhân &amp; Gói Nhóm linh hoạt số người</text>
    <text x="678" y="308" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#059669">Thêm/bớt chỗ giữa kỳ · Hỗ trợ mã khuyến mãi</text>

    <rect x="664" y="326" width="252" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="678" y="346" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">🪙 Ví Credits &amp; Hạn mức minh bạch</text>
    <text x="678" y="364" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Theo dõi % token và lượt chạy ngay trên thanh bên</text>
    <text x="678" y="378" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="10.5" fill="#475569">Sổ cái giao dịch rõ ràng theo từng workspace</text>

    <rect x="664" y="398" width="252" height="98" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="678" y="420" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">🌐 Địa chỉ riêng cho Nhóm</text>
    <text x="678" y="440" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#047857">• Đặt subdomain hoặc tên miền riêng cho nhóm</text>
    <text x="678" y="460" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#047857">• Hội thoại cá nhân trong nhóm vẫn riêng tư</text>
    <text x="678" y="480" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="11" fill="#047857">  trừ khi bạn chủ động chia sẻ</text>
  </g>
</svg>

