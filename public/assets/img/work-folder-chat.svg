<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Minh họa Gehihi Work: cây thư mục tài liệu, nhãn nguồn gốc tệp và trò chuyện với trợ lý AI theo thư mục">
